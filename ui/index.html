<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tender — Self-Hosted AI Chatbot</title>
    <meta
      name="description"
      content="A self-hosted AI chatbot with a React frontend and FastAPI backend, powered by a locally-hosted LLM via Ollama."
    />

    <link rel="icon" type="image/png" href="/favicon.png" />

    <!-- The URL-bearing tags (canonical, og:url, og:image, twitter:image) are
         deliberately absent until there is a real deployed hostname. They
         previously pointed at https://example.com, which is worse than omitting
         them: a canonical URL naming another origin tells a crawler the real
         page lives there, and og:image pointed at a file that has never
         existed. Restore all four together once a deployment has a hostname,
         and switch twitter:card back to summary_large_image at the same time --
         that card type renders badly with no image. -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Tender — Self-Hosted AI Chatbot" />
    <meta
      property="og:description"
      content="A self-hosted AI chatbot with a React frontend and FastAPI backend, powered by a locally-hosted LLM via Ollama."
    />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Tender — Self-Hosted AI Chatbot" />
    <meta
      name="twitter:description"
      content="A self-hosted AI chatbot with a React frontend and FastAPI backend, powered by a locally-hosted LLM via Ollama."
    />

    <!-- Analytics: skipped for now (no provider configured). Drop a privacy-friendly
         snippet (e.g. Plausible) here before deploying, and remove the cookie
         consent banner if the provider you pick doesn't use cookies. -->

    <!-- Applies a stored theme choice before first paint, so there's no flash of
         the wrong theme. No stored choice = defer to prefers-color-scheme in CSS. -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("tender-theme");
          if (stored === "light" || stored === "dark") {
            document.documentElement.setAttribute("data-theme", stored);
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
